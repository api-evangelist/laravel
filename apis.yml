aid: laravel
name: Laravel
description: 'Laravel is the company behind the Laravel PHP framework and a suite of commercial developer
  infrastructure products: Laravel Cloud (a fully managed PaaS for deploying and scaling Laravel and Symfony
  applications), Laravel Forge (server provisioning and application deployment across DigitalOcean, AWS,
  Hetzner, Vultr, Akamai/Linode and custom VPS), Envoyer (zero-downtime PHP deployments), Vapor (serverless
  deployment on AWS Lambda), Nightwatch (application monitoring) and Nova (an administration panel). Both
  Laravel Cloud and the current Laravel Forge API publish machine-readable OpenAPI 3.1 descriptions and
  follow JSON:API-style conventions with cursor pagination, sparse filtering, sorting and relationship
  includes. Laravel also ships Laravel Boost, a first-party MCP server and Agent Skills bundle that gives
  AI coding agents structured access to Laravel ecosystem context and documentation.'
