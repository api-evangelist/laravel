- aid: laravel:envoyer-api
  name: Envoyer API
  description: >-
    The Envoyer REST API for zero-downtime PHP deployments. Create and manage projects, servers, environments,
    deployment hooks, deployments, collaborators and notifications. Bearer API key authentication with
    a scope model in which all GET endpoints are readable by any token and *:create scopes govern resource
    creation and updates.
  humanURL: https://envoyer.io/api-documentation
  baseURL: https://envoyer.io/api
  tags:
  - Deployment
  properties:
  - type: Documentation
    url: https://envoyer.io/api-documentation
