- aid: laravel:forge-api-legacy
  name: Laravel Forge API (Legacy v1)
  description: >-
    The legacy v1 Laravel Forge REST API, documented at forge.laravel.com/api-documentation. Laravel has
    marked this version deprecated and states it will be discontinued on July 31, 2026; integrators are
    directed to the current Forge API. Retained here for lifecycle and migration research.
  humanURL: https://forge.laravel.com/api-documentation
  baseURL: https://forge.laravel.com/api/v1
  tags:
  - Server Management
  - Deployment
