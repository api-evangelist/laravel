  - name: tailwindcss-development
    package: Tailwind CSS
  - name: volt-development
    package: Volt
  - name: wayfinder-development
    package: Wayfinder
  agents_md:
    generated: true
    note: '`php artisan boost:install` generates agent guideline files including CLAUDE.md and AGENTS.md
      for the coding agents selected during installation. These are generated per-application rather
