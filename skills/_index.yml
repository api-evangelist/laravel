provider_published_skills:
  method: searched
  source: https://laravel.com/docs/13.x/boost
  format: Agent Skills — a folder containing a SKILL.md with YAML frontmatter (name, description) and
    markdown instructions, optionally with scripts, templates and reference material.
  distribution: Installed into an application's .ai/skills/ directory by `php artisan boost:install`,
    selected automatically based on the packages detected in composer.json.
  extensible: Third-party packages ship their own by adding resources/boost/skills/{skill-name}/SKILL.md;
    applications override a built-in skill by matching its name.
  package: laravel/boost
  skills:
