gaps:
- No first-party client library is published for the Laravel Cloud API; the Cloud API is bearer-token
  REST only, consumed directly or via the dashboard.
- No first-party client library is published for the Envoyer API.
- Despite publishing OpenAPI 3.1 for both Forge and Cloud, Laravel ships no generated SDKs in languages
  other than PHP.
