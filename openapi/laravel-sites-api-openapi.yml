      - name: filter[name]
        in: query
        description: The name of the site.
        schema:
          type: string
          examples:
          - forge.laravel.com
      - name: sort
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - name
            - -name
            - created_at
            - -created_at
            - updated_at
            - -updated_at
        explode: false
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - server
            - serverCount
            - serverExists
            - tags
            - tagsCount
            - tagsExists
            - latestDeployment
            - latestDeploymentCount
            - latestDeploymentExists
            - securityRules
