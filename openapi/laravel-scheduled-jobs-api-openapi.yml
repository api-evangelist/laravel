      security:
      - oauth2:
        - server:view
      x-permissions:
      - server:view
      x-mint:
        metadata:
          noindex: true
      x-processingMode: sync
    post:
      operationId: organizations.servers.sites.scheduled-jobs.store
      description: 'Create a specific scheduled job for the site.


        Processing mode: async'
      summary: Create site scheduled job
      tags:
      - Scheduled Jobs
      parameters:
      - name: organization
