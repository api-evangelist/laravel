openapi: 3.2.0
info:
  title: Laravel Commands API
  version: 0.0.1
  description: 'Operations tagged Commands across 2 of this provider''s published API definitions: laravel-forge-openapi.json, laravel-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://forge.laravel.com/api
- url: https://cloud.laravel.com/api
tags:
- name: Commands
paths:
  /orgs/{organization}/servers/{server}/sites/{site}/commands:
    get:
      operationId: organizations.servers.sites.commands.index
      description: 'List all command runs for the site.


        Processing mode: sync'
      summary: List commands
      tags:
      - Commands
      parameters:
      - name: organization
        in: path
        required: true
        description: The organization slug
        schema:
          type: string
      - name: server
        in: path
        required: true
        description: The server ID
        schema:
          type: integer
      - name: site
        in: path
        required: true
        description: The site ID
        schema:
          type: integer
      - name: page[size]
        in: query
        description: The number of results that will be returned per page.
        schema:
          type: integer
          default: 30
      - name: page[cursor]
        in: query
        description: The cursor to start the pagination from.
        schema:
          type: string
      - name: filter[user_id]
        in: query
        description: The user ID of the command initiator.
        schema:
          type: string
          examples:
          - 1
      - name: filter[status]
        in: query
        description: The status of the command.
        schema:
          type: string
          examples:
          - finished
      - name: filter[command]
        in: query
        description: The command it ran.
        schema:
          type: string
          examples:
          - git status
      - name: sort
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - status
            - -status
            - created_at
            - -created_at
            - updated_at
            - -updated_at
        explode: false
      responses:
        '200':
          description: Paginated set of `CommandResource`
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommandResource'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type: string
                      next:
                        type: string
                  meta:
                    type: object
                    properties:
                      path:
                        type:
                        - string
                        - 'null'
                        description: Base path for paginator generated URLs.
                      per_page:
                        type: integer
                        description: Number of items shown per page.
                        minimum: 0
                      next_cursor:
                        type:
                        - string
                        - 'null'
                        description: The "cursor" that points to the next set of items.
                      prev_cursor:
                        type:
                        - string
                        - 'null'
                        description: The "cursor" that points to the previous set of items.
                    required:
                    - path
                    - per_page
                    - next_cursor
                    - prev_cursor
                  included:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResource'
                required:
                - data
                - links
                - meta
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
      security:
      - oauth2:
        - server:view
      x-permissions:
      - server:view
      x-mint:
        metadata:
          noindex: true
      x-processingMode: sync
    post:
      operationId: organizations.servers.sites.commands.store
      description: 'Run a command on the site.


        Processing mode: async'
      summary: Create command
      tags:
      - Commands
      parameters:
      - name: organization
        in: path
        required: true
        description: The organization slug
        schema:
          type: string
      - name: server
        in: path
        required: true
        description: The server ID
        schema:
          type: integer
      - name: site
        in: path
        required: true
        description: The site ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunSiteCommandRequest'
      responses:
        '202':
          description: The command has been queued for execution.
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
      security:
      - oauth2:
        - site:manage-commands
      x-permissions:
      - site:manage-commands
      x-mint:
        metadata:
          noindex: true
      x-processingMode: async
    servers:
    - url: https://forge.laravel.com/api
  /orgs/{organization}/servers/{server}/sites/{site}/commands/{command}:
    get:
      operationId: organizations.servers.sites.commands.show
      description: 'Get a specific command run.


        Processing mode: sync'
      summary: Get command
      tags:
      - Commands
      parameters:
      - name: organization
        in: path
        required: true
        description: The organization slug
        schema:
          type: string
      - name: server
        in: path
        required: true
        description: The server ID
        schema:
          type: integer
      - name: site
        in: path
        required: true
        description: The site ID
        schema:
          type: integer
      - name: command
        in: path
        required: true
        description: The command ID
        schema:
          type: integer
      responses:
        '200':
          description: '`CommandResource`'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CommandResource'
                  included:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResource'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
      security:
      - oauth2:
        - server:view
      x-permissions:
      - server:view
      x-mint:
        metadata:
          noindex: true
      x-processingMode: sync
    delete:
      operationId: organizations.servers.sites.commands.destroy
      description: 'Delete a command history.


        Processing mode: sync'
      summary: Delete command
      tags:
      - Commands
      parameters:
      - name: organization
        in: path
        required: true
        description: The organization slug
        schema:
          type: string
      - name: server
        in: path
        required: true
        description: The server ID
        schema:
          type: integer
      - name: site
        in: path
        required: true
        description: The site ID
        schema:
          type: integer
      - name: command
        in: path
        required: true
        description: The command ID
        schema:
          type: integer
      responses:
        '202':
          description: ''
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
      security:
      - oauth2:
        - site:manage-commands
      x-permissions:
      - site:manage-commands
      x-mint:
        metadata:
          noindex: true
      x-processingMode: sync
    servers:
    - url: https://forge.laravel.com/api
  /orgs/{organization}/servers/{server}/sites/{site}/commands/{command}/output:
    get:
      operationId: organizations.servers.sites.commands.output.show
      description: 'Get the output of a specific command run.


        Processing mode: sync'
      summary: Get command output
      tags:
      - Commands
      parameters:
      - name: organization
        in: path
        required: true
        description: The organization slug
        schema:
          type: string
      - name: server
        in: path
        required: true
        description: The server ID
        schema:
          type: integer
      - name: site
        in: path
        required: true
        description: The site ID
        schema:
          type: integer
      - name: command
        in: path
        required: true
        description: The command ID
        schema:
          type: integer
      responses:
        '200':
          description: '`CommandOutputResource`'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CommandOutputResource'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
      security:
      - oauth2:
        - server:view
      x-permissions:
      - server:view
      x-mint:
        metadata:
          noindex: true
      x-processingMode: sync
    servers:
    - url: https://forge.laravel.com/api
  /environments/{environment}/commands:
    get:
      operationId: public.environments.commands.index
      description: Get a list of all commands for the given environment.
      summary: List commands
      tags:
      - Commands
      parameters:
      - name: environment
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
      - name: filter[status]
        in: query
        schema:
          type: string
      - name: filter[command]
        in: query
        schema:
          type: string
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - environment
            - deployment
            - initiator
        explode: false
      responses:
        '200':
          description: Paginated set of `CommandResource`
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommandResource_2'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type: string
                      next:
                        type: string
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        minimum: 1
                      from:
                        type:
                        - integer
                        - 'null'
                        minimum: 1
                      last_page:
                        type: integer
                        minimum: 1
                      links:
                        type: array
                        description: Generated paginator links.
                        items:
                          type: object
                          properties:
                            url:
                              type:
                              - string
                              - 'null'
                            label:
                              type: string
                            active:
                              type: boolean
                          required:
                          - url
                          - label
                          - active
                      path:
                        type:
                        - string
                        - 'null'
                        description: Base path for paginator generated URLs.
                      per_page:
                        type: integer
                        description: Number of items shown per page.
                        minimum: 0
                      to:
                        type:
                        - integer
                        - 'null'
                        description: Number of the last item in the slice.
                        minimum: 1
                      total:
                        type: integer
                        description: Total number of items being paginated.
                        minimum: 0
                    required:
                    - current_page
                    - from
                    - last_page
                    - links
                    - path
                    - per_page
                    - to
                    - total
                  included:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/EnvironmentResource'
                      - $ref: '#/components/schemas/DeploymentResource'
                      - $ref: '#/components/schemas/UserResource_2'
                required:
                - data
                - links
                - meta
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
      security:
      - http: []
    post:
      operationId: public.environments.commands.store
      description: Run a command on the given environment.
      summary: Run command
      tags:
      - Commands
      parameters:
      - name: environment
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommandRequest'
      responses:
        '200':
          description: '`CommandResource`'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CommandResource_2'
                  included:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/EnvironmentResource'
                      - $ref: '#/components/schemas/DeploymentResource'
                      - $ref: '#/components/schemas/UserResource_2'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
      security:
      - http: []
    servers:
    - url: https://cloud.laravel.com/api
  /commands/{command}:
    get:
      operationId: public.commands.show
      description: Get the details of a specific command.
      summary: Get command
      tags:
      - Commands
      parameters:
      - name: command
        in: path
        required: true
        description: The command identifier
        schema:
          type: string
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - environment
            - deployment
            - initiator
        explode: false
      responses:
        '200':
          description: '`CommandResource`'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CommandResource_2'
                  included:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/EnvironmentResource'
                      - $ref: '#/components/schemas/DeploymentResource'
                      - $ref: '#/components/schemas/UserResource_2'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
      security:
      - http: []
    servers:
    - url: https://cloud.laravel.com/api
components:
  responses:
    ModelNotFoundException:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Error overview.
            required:
            - message
    ValidationException:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Errors overview.
              errors:
                type: object
                description: A detailed description of each field that failed validation.
                additionalProperties:
                  type: array
                  items:
                    type: string
            required:
            - message
            - errors
    AuthorizationException:
      description: Authorization error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Error overview.
            required:
            - message
  schemas:
    UserResourceIdentifier:
      type: object
      properties:
        type:
          type: string
          enum:
          - users
        id:
          type: string
      required:
      - type
      - id
      title: UserResourceIdentifier
    CommandStatus:
      type: string
      enum:
      - waiting
      - running
      - finished
      - timeout
      - failed
      title: CommandStatus
    Link:
      type: object
      properties:
        href:
          type: string
          format: uri
        rel:
          type: string
        describedby:
          type: string
        title:
          type: string
        type:
          type: string
        hreflang:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
        meta:
          type: object
      required:
      - href
      title: Link
    CommandOutputResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - commandOutputs
        attributes:
          type: object
          properties:
            output:
              type: string
              description: The output of the command execution.
              examples:
              - Now using node v22.0.0 (npm v10.5.1)
          required:
          - output
        links:
          type: object
          properties:
            self:
              description: A link to the resource itself
              $ref: '#/components/schemas/Link'
          required:
          - self
      required:
      - id
      - type
      - links
      title: CommandOutputResource
    CommandResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - commands
        attributes:
          type: object
          properties:
            command:
              type: string
              description: The command that ran.
              examples:
              - nvm use 22
            status:
              description: The status of the command.
              examples:
              - finished
              $ref: '#/components/schemas/CommandStatus'
            exit_code:
              type:
              - integer
              - 'null'
              description: The exit code of the command. Null while the command is still running or if it never produced one (e.g. an SSH failure or timeout).
              examples:
              - 0
            error_output:
              type:
              - string
              - 'null'
              description: The failure detail when the command did not succeed. Null when the command succeeded or has not finished.
              examples:
              - Tunnel exited with a non-zero code [1].
            duration:
              type: string
              description: The duration of the command in human-readable format.
              examples:
              - 5m
            user_id:
              type: integer
              description: The ID of the user who initiated the command.
              examples:
              - 1
            created_at:
              type: string
              format: date-time
              description: The date and time the command was created.
              examples:
              - '2025-07-29T09:00:00Z'
            updated_at:
              type: string
              format: date-time
              description: The date and time the command was last updated.
              examples:
              - '2025-07-29T09:00:00Z'
          required:
          - command
          - status
          - exit_code
          - error_output
          - duration
          - user_id
          - created_at
          - updated_at
        relationships:
          type: object
          properties:
            user:
              type: object
              description: The user who initiated the command.
              properties:
                data:
                  anyOf:
                  - $ref: '#/components/schemas/UserResourceIdentifier'
                  - type: 'null'
              required:
              - data
        links:
          type: object
          properties:
            self:
              description: A link to the resource itself
              $ref: '#/components/schemas/Link'
          required:
          - self
      required:
      - id
      - type
      - links
      title: CommandResource
    RunSiteCommandRequest:
      type: object
      properties:
        command:
          type: string
          description: The command to run.
          examples:
          - nvm use 22
      required:
      - command
      title: RunSiteCommandRequest
    UserResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - users
        attributes:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            created_at:
              type:
              - string
              - 'null'
              format: date-time
            updated_at:
              type:
              - string
              - 'null'
              format: date-time
          required:
          - name
          - email
          - created_at
          - updated_at
        links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
          required:
          - self
      required:
      - id
      - type
      - links
      title: UserResource
    InstanceResourceIdentifier:
      type: object
      properties:
        type:
          type: string
          enum:
          - instances
        id:
          type: string
      required:
      - type
      - id
      title: InstanceResourceIdentifier
    WebsocketApplicationResourceIdentifier:
      type: object
      properties:
        type:
          type: string
          enum:
          - websocketApplications
        id:
          type: string
      required:
      - type
      - id
      title: WebsocketApplicationResourceIdentifier
    DeploymentStatus:
      type: string
      enum:
      - pending
      - build.pending
      - build.created
      - build.queued
      - build.running
      - build.succeeded
      - build.failed
      - cancelled
      - failed
      - deployment.pending
      - deployment.created
      - deployment.queued
      - deployment.running
      - deployment.succeeded
      - deployment.failed
      title: DeploymentStatus
    CacheResourceIdentifier:
      type: object
      properties:
        type:
          type: string
          enum:
          - caches
        id:
          type: string
      required:
      - type
      - id
      title: CacheResourceIdentifier
    BotControlCategory:
      type: string
      enum:
      - academic_research
      - accessibility
      - advertising_and_marketing
      - aggregator
      - ai_assistant
      - ai_crawler
      - ai_search
      - feed_fetcher
      - monitoring_and_analytics
      - page_preview
      - search_engine_crawler
      - search_engine_optimization
      - security
      - social_media_marketing
      - webhooks
      - other
      title: BotControlCategory
    ApplicationResourceIdentifier:
      type: object
      properties:
        type:
          type: string
          enum:
          - applications
        id:
          type: string
      required:
      - type
      - id
      title: ApplicationResourceIdentifier
    BranchResourceIdentifier:
      type: object
      properties:
        type:
          type: string
          enum:
          - branches
        id:
          type: string
      required:
      - type
      - id
      title: BranchResourceIdentifier
    EnvironmentColor:
      type: string
      enum:
      - blue
      - green
      - orange
      - purple
      - red
      - yellow
      - cyan
      - gray
      title: EnvironmentColor
    CommandResource_2:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - commands
        attributes:
          type: object
          properties:
            command:
              type: string
            output:
              type:
              - string
              - 'null'
            status:
              $ref: '#/components/schemas/CommandStatus_2'
            exit_code:
              anyOf:
              - $ref: '#/components/schemas/ExitCode'
              - type: 'null'
            failure_reason:
              type:
              - string
              - 'null'
            started_at:
              type:
              - string
              - 'null'
              format: date-time
            finished_at:
              type:
              - string
              - 'null'
              format: date-time
            created_at:
              type:
              - string
              - 'null'
              format: date-time
          required:
          - command
          - output
          - status
          - exit_code
          - failure_reason
          - started_at
          - finished_at
          - created_at
        relationships:
          type: object
          properties:
            environment:
              type: object
              properties:
                data:
                  anyOf:
                  - $ref: '#/components/schemas/EnvironmentResourceIdentifier'
                  - type: 'null'
              required:
              - data
            deployment:
              type: object
              properties:
                data:
                  anyOf:
                  - $ref: '#/components/schemas/DeploymentResourceIdentifier'
                  - type: 'null'
              required:
              - data
            initiator:
              type: object
              properties:
                data:
                  anyOf:
                  - $ref: '#/components/schemas/UserResourceIdentifier'
                  - type: 'null'
              required:
              - data
        links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
          required:
          - self
      required:
      - id
      - type
      - links
      title: CommandResource
    EnvironmentResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - environments
        attributes:
          type: object
          properties:
            name:
              type: string
            slug:
              type: string
            status:
              $ref: '#/components/schemas/EnvironmentStatus'
            color:
              $ref: '#/components/schemas/EnvironmentColor'
            created_from_automation:
              type: boolean
            vanity_domain:
              type: string
            framework:
              $ref: '#/components/schemas/Framework'
            language:
              $ref: '#/components/schemas/Language'
            php_major_version:
              type: string
            serving:
              type: string
            build_command:
              type:
              - string
              - 'null'
            node_version:
              $ref: '#/components/schemas/NodeVersion'
            deploy_command:
              type:
              - string
              - 'null'
            start_command:
              type:
              - string
              - 'null'
            uses_octane:
              type: boolean
            uses_hibernation:
              type: boolean
            hibernation_wake_up_interval:
              type:
              - integer
              - 'null'
            timeout:
              type: integer
              description: The number of seconds the environment will wait for your application to respond before timing out. Changes take effect on the next deployment.
            shutdown_timeout:
              type: integer
              description: The number of seconds to wait before stopping the previous deployment's compute instances, allowing it to finish processing requests and jobs after a new deployment becomes active. Changes take effect on the next deployment.
