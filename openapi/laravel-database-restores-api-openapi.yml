openapi: 3.2.0
info:
  title: Laravel Cloud Database Restores API
  version: 0.0.1
servers:
- url: https://cloud.laravel.com/api
security:
- http: []
tags:
- name: Database Restores
paths:
  /databases/clusters/{database}/restore:
    post:
      operationId: public.databases.clusters.restore
      description: Restore a database cluster from a point in time or snapshot. Returns the newly created database.
      summary: Create a database restore
      tags:
      - Database Restores
      parameters:
      - name: database
        in: path
        required: true
        description: The database identifier
        schema:
          type:
          - string
          - 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreDatabaseRestoreRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
components:
  responses:
    ModelNotFoundException:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Error overview.
            required:
            - message
    AuthorizationException:
      description: Authorization error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Error overview.
            required:
            - message
    ValidationException:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Errors overview.
              errors:
                type: object
                description: A detailed description of each field that failed validation.
                additionalProperties:
                  type: array
                  items:
                    type: string
            required:
            - message
            - errors
  schemas:
    StoreDatabaseRestoreRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the new database created from the restore.
          pattern: ^[a-z0-9_-]+$
          minLength: 2
          maxLength: 40
        restore_time:
          type:
          - string
          - 'null'
          format: date-time
          description: The point in time to restore the database to. Must not be used with database_snapshot_id.
        database_snapshot_id:
          type:
          - string
          - 'null'
      required:
      - name
      title: StoreDatabaseRestoreRequest
  securitySchemes:
    http:
      type: http
      description: The Bearer Token generated on the Cloud UI.
      scheme: bearer
      bearerFormat: bearer
x-provenance:
  method: harvested
  publisher: Laravel
  source: https://cloud.laravel.com/api-docs/api.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
