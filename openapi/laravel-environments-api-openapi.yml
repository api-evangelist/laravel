      - add_txt_records
      - add_dns_records
      - failed
      title: DomainActionRequired
    FilesystemLocationHint:
      type: string
      description: 'Where Cloudflare should place an R2 bucket''s data. Automatic lets Cloudflare choose, which it does from the caller''s location rather than the customer''s.

        '
      enum:
      - automatic
      - wnam
      - enam
      - weur
      - eeur
      - apac
      - oc
      title: FilesystemLocationHint
    UpdateEnvironmentRequest:
      type: object
      properties:
        serving:
          type: object
          properties:
            mode:
              type: string
              enum:
              - process
            root:
              type:
              - string
              - 'null'
              maxLength: 255
          required:
          - mode
          - root
        name:
          type: string
          pattern: ^[A-Za-z0-9 _-]+$
          minLength: 1
          maxLength: 40
        slug:
          type: string
          minLength: 1
        color:
          $ref: '#/components/schemas/EnvironmentColor'
        branch:
          type: string
        uses_push_to_deploy:
          type: boolean
        uses_deploy_hook:
          type: boolean
        timeout:
          type: integer
          description: The number of seconds the environment will wait for your application to respond before timing out. Applies on the next deployment.
          examples:
          - 30
          minimum: 5
          maximum: 60
        php_version:
          $ref: '#/components/schemas/PhpVersion'
        build_command:
          type:
          - string
          - 'null'
          maxLength: 2000
        node_version:
          $ref: '#/components/schemas/NodeVersion'
        deploy_command:
          type:
          - string
          - 'null'
          maxLength: 2000
        start_command:
          type:
          - string
          - 'null'
          description: The command that starts a dynamic application, e.g. `gunicorn myproject.wsgi`. Required for dynamic JavaScript, Python, Ruby, Go, Rust and Java apps; prohibited for PHP apps and static websites.
          maxLength: 255
        uses_vanity_domain:
          type: boolean
        database_schema_id:
          type:
          - string
          - 'null'
          description: The identifier of the database schema to attach to the environment. Send null or an empty string to detach the database, or skip it entirely to leave it unchanged.
        cache_id:
          type:
          - string
          - 'null'
          description: The identifier of the cache to attach to the environment. Send null or an empty string to detach the cache, or skip it entirely to leave it unchanged.
        websocket_application_id:
          type:
          - string
          - 'null'
          description: The identifier of the WebSocket application to attach to the environment. Send null or an empty string to detach the WebSocket application, or skip it entirely to leave it unchanged.
        filesystem_keys:
          type: array
          description: An array of the object storage buckets that should be attached to the environment. Send an emtpy array ([]) to detach all buckets.
          items:
            type: object
            properties:
              id:
                type: string
              disk:
                type: string
                pattern: ^[A-Za-z0-9 _-]+$
                minLength: 1
                maxLength: 40
              is_default_disk:
                type: boolean
            required:
            - id
            - disk
            - is_default_disk
        uses_octane:
          type: boolean
        sleep_timeout:
          type: integer
          minimum: 1
          maximum: 60
        hibernation_wake_up_interval:
          type:
          - integer
          - 'null'
          description: The periodic wake-up interval in minutes for hibernating environments. Send null to disable, or a value between 1 and 10080 (7 days) to enable. Requires hibernation to be enabled.
          minimum: 1
          maximum: 10080
        shutdown_timeout:
          type: integer
          description: The number of seconds to wait before stopping the previous deployment's compute instances, allowing it to finish processing requests and jobs after a new deployment becomes active. Applies on the next deployment.
          examples:
          - 30
          minimum: 1
          maximum: 600
        uses_purge_edge_cache_on_deploy:
          type: boolean
        nightwatch_token:
          type:
          - string
          - 'null'
          minLength: 44
          maxLength: 44
        cache_strategy:
          $ref: '#/components/schemas/CacheStrategy'
        response_headers_frame:
          $ref: '#/components/schemas/Frame'
        response_headers_content_type:
          $ref: '#/components/schemas/ContentType'
        response_headers_robots_tag:
          $ref: '#/components/schemas/RobotsTag'
        response_headers_hsts:
          type: object
          properties:
            max_age:
              type:
              - number
              - 'null'
              minimum: 0
            include_subdomains:
              type: boolean
            preload:
              type: boolean
          required:
          - max_age
          - include_subdomains
          - preload
        firewall_block_path:
          type: boolean
        firewall_browser_integrity_check:
          type: boolean
      title: UpdateEnvironmentRequest
    SqsQueueStatus:
      type: string
      enum:
      - creating
      - updating
      - available
      - deleting
      - deleted
      - unknown
      title: SqsQueueStatus
    UserResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - users
        attributes:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            avatar_url:
              type: string
            created_at:
              type:
              - string
              - 'null'
              format: date-time
          required:
          - name
          - email
          - avatar_url
          - created_at
      required:
      - id
      - type
      title: UserResource
    StartEnvironmentRequest:
      type: object
      properties:
        redeploy:
          type:
          - boolean
          - 'null'
          description: Pass true to redeploy the environment with the same commit as the latest deployment. Otherwise, the latest commit will be used.
      title: StartEnvironmentRequest
    RepositoryResourceIdentifier:
      type: object
      properties:
        type:
          type: string
          enum:
          - repositories
        id:
          type: string
      required:
      - type
      - id
      title: RepositoryResourceIdentifier
    InstanceSize:
      type: string
      enum:
      - flex-512mb
      - flex-1gb
      - flex-2gb
      - flex.c-1vcpu-256mb
