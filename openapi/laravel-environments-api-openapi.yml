          - type: object
            properties:
              status:
                type: integer
              method:
                type: string
              path:
                type: string
              duration_ms:
                type:
                - number
                - 'null'
              bytes_sent:
                type:
                - integer
                - 'null'
              ip:
                type:
                - string
                - 'null'
              user_agent:
                type:
                - string
                - 'null'
              country:
                type:
                - string
                - 'null'
            required:
            - status
            - method
            - path
            - duration_ms
            - bytes_sent
            - ip
            - user_agent
            - country
          - type: object
            properties:
              channel:
                type:
                - string
                - 'null'
              context:
                type:
                - object
                - 'null'
                additionalProperties: {}
              extra:
                type:
                - object
                - 'null'
                additionalProperties: {}
            required:
            - channel
            - context
            - extra
          - type: object
            properties:
              class:
                type:
                - string
                - 'null'
              code:
                type:
                - integer
                - 'null'
              file:
                type:
                - string
                - 'null'
              trace:
                type:
                - array
                - 'null'
                items:
                  type: string
            required:
            - class
            - code
            - file
            - trace
          - type: object
            additionalProperties: {}
          - type: 'null'
      required:
      - message
      - level
      - type
      - logged_at
      - data
      title: NormalizedLogResource
    BranchResourceIdentifier:
      type: object
      properties:
        type:
