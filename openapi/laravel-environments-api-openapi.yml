              type: string
            type:
              $ref: '#/components/schemas/CacheType'
            status:
              $ref: '#/components/schemas/CacheStatus'
            region:
              $ref: '#/components/schemas/CloudRegion'
            size:
              $ref: '#/components/schemas/CacheSize'
            auto_upgrade_enabled:
              type: boolean
            is_public:
              type: boolean
            eviction_policy:
              anyOf:
              - description: Null for cache types without eviction policy settings.
                $ref: '#/components/schemas/CacheEvictionPolicy'
              - type: 'null'
            uses_hibernation:
              type: boolean
            hibernation_timeout:
              type:
              - integer
              - 'null'
            created_at:
              type:
              - string
              - 'null'
              format: date-time
            connection:
              type: object
              properties:
                hostname:
                  type:
                  - string
                  - 'null'
                port:
                  type:
                  - integer
                  - 'null'
                protocol:
                  type: string
                  const: redis
                ? ''
                : anyOf:
                  - type: object
                    properties:
                      username:
                        type:
                        - string
                        - 'null'
                      password:
                        type:
                        - string
                        - 'null'
                    required:
                    - username
                    - password
                  - type: array
                    items:
                      type: string
                    minItems: 0
                    maxItems: 0
                    additionalItems: false
              required:
              - hostname
              - port
              - protocol
              - null
          required:
          - name
          - type
          - status
          - region
          - size
          - auto_upgrade_enabled
          - is_public
          - eviction_policy
          - uses_hibernation
          - hibernation_timeout
          - created_at
          - connection
        relationships:
          type: object
          properties:
            environments:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/EnvironmentResourceIdentifier'
              required:
              - data
