                  properties:
                    path:
                      type: string
                    port:
                      type: integer
                    delay:
                      type: integer
                    interval:
                      type: integer
                    timeout:
                      type: integer
                    tries:
                      type: integer
            scaling_cpu_threshold_percentage:
              type:
              - integer
              - 'null'
            scaling_memory_threshold_percentage:
              type:
              - integer
              - 'null'
            created_at:
              type:
              - string
              - 'null'
              format: date-time
