openapi: 3.2.0
info:
  title: Laravel Cloud Environments API
  version: 0.0.1
servers:
- url: https://cloud.laravel.com/api
security:
- http: []
tags:
- name: Environments
paths:
  /applications/{application}/environments:
    get:
      operationId: public.applications.environments.index
      description: Get a list of all environments for the given application.
      summary: List environments
      tags:
      - Environments
      parameters:
      - name: application
        in: path
        required: true
        description: The application identifier
        schema:
          type: string
      - name: filter[name]
        in: query
        schema:
          type: string
      - name: filter[status]
        in: query
        schema:
          type: string
      - name: filter[slug]
        in: query
        schema:
          type: string
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - application
            - branch
            - deployments
            - currentDeployment
            - primaryDomain
            - instances
            - database
            - cache
            - buckets
            - websocketApplication
            - secrets
        explode: false
      responses:
        '200':
          description: Paginated set of `EnvironmentResource`
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnvironmentResource'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type: string
                      next:
                        type: string
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        minimum: 1
                      from:
                        type:
                        - integer
                        - 'null'
                        minimum: 1
                      last_page:
                        type: integer
                        minimum: 1
                      links:
                        type: array
                        description: Generated paginator links.
                        items:
                          type: object
                          properties:
                            url:
                              type:
                              - string
                              - 'null'
                            label:
                              type: string
                            active:
                              type: boolean
                          required:
                          - url
                          - label
                          - active
                      path:
                        type:
                        - string
                        - 'null'
                        description: Base path for paginator generated URLs.
                      per_page:
                        type: integer
                        description: Number of items shown per page.
                        minimum: 0
                      to:
                        type:
                        - integer
                        - 'null'
                        description: Number of the last item in the slice.
                        minimum: 1
                      total:
                        type: integer
                        description: Total number of items being paginated.
                        minimum: 0
                    required:
                    - current_page
                    - from
                    - last_page
                    - links
                    - path
                    - per_page
                    - to
                    - total
                  included:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/ApplicationResource'
                      - $ref: '#/components/schemas/BranchResource'
                      - $ref: '#/components/schemas/DeploymentResource'
                      - $ref: '#/components/schemas/DomainResource'
                      - $ref: '#/components/schemas/InstanceResource'
                      - $ref: '#/components/schemas/DatabaseSchemaResource'
                      - $ref: '#/components/schemas/CacheResource'
                      - $ref: '#/components/schemas/FilesystemResource'
                      - $ref: '#/components/schemas/WebsocketApplicationResource'
                      - $ref: '#/components/schemas/SecretResource'
                required:
                - data
                - links
                - meta
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
    post:
      operationId: public.applications.environments.store
      description: Create a new environment.
      summary: Create environment
      tags:
      - Environments
      parameters:
      - name: application
        in: path
        required: true
        description: The application identifier
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /environments/{environment}/logs:
    get:
      operationId: public.environments.logs.index
      description: Get a list of logs for the given environment.
      summary: List environment logs
      tags:
      - Environments
      parameters:
      - name: environment
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
      - name: query
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: type
        in: query
        schema:
          type:
          - string
          - 'null'
          enum:
          - all
          - application
          - access
          - null
      - name: case_sensitive
        in: query
        schema:
          type:
          - boolean
          - 'null'
      - name: whole_word
        in: query
        schema:
          type:
          - boolean
          - 'null'
      - name: instances[]
        in: query
        schema:
          type: array
          items:
            type: string
      - name: cursor
        in: query
        description: Pagination cursor from a previous response. Pass this to fetch the next page of logs.
        schema:
          type:
          - string
          - 'null'
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Array of `NormalizedLogResource`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NormalizedLogResource'
                  meta:
                    type: object
                    properties:
                      cursor:
                        type: string
                      type:
                        anyOf:
                        - type: string
                        - type: string
                          enum:
                          - all
                      from:
                        type: string
                      to:
                        type: string
                    required:
                    - cursor
                    - type
                    - from
                    - to
                required:
                - data
                - meta
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /environments/{environment}:
    get:
      operationId: public.environments.show
      description: Get a specific environment.
      summary: Get environment
      tags:
      - Environments
      parameters:
      - name: environment
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
      - name: include
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - application
            - branch
            - deployments
            - currentDeployment
            - primaryDomain
            - instances
            - database
            - cache
            - buckets
            - websocketApplication
            - secrets
        explode: false
      responses:
        '200':
          description: '`EnvironmentResource`'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EnvironmentResource'
                  included:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/ApplicationResource'
                      - $ref: '#/components/schemas/BranchResource'
                      - $ref: '#/components/schemas/DeploymentResource'
                      - $ref: '#/components/schemas/DomainResource'
                      - $ref: '#/components/schemas/InstanceResource'
                      - $ref: '#/components/schemas/DatabaseSchemaResource'
                      - $ref: '#/components/schemas/CacheResource'
                      - $ref: '#/components/schemas/FilesystemResource'
                      - $ref: '#/components/schemas/WebsocketApplicationResource'
                      - $ref: '#/components/schemas/SecretResource'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
    patch:
      operationId: public.environments.update
      description: Update an environment.
      summary: Update environment
      tags:
      - Environments
      parameters:
      - name: environment
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvironmentRequest'
      responses:
        '200':
          description: '`EnvironmentResource`'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EnvironmentResource'
                  included:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/ApplicationResource'
                      - $ref: '#/components/schemas/BranchResource'
                      - $ref: '#/components/schemas/DeploymentResource'
                      - $ref: '#/components/schemas/DomainResource'
                      - $ref: '#/components/schemas/InstanceResource'
                      - $ref: '#/components/schemas/DatabaseSchemaResource'
                      - $ref: '#/components/schemas/CacheResource'
                      - $ref: '#/components/schemas/FilesystemResource'
                      - $ref: '#/components/schemas/WebsocketApplicationResource'
                      - $ref: '#/components/schemas/SecretResource'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
    delete:
      operationId: public.environments.destroy
      description: Delete an environment.
      summary: Delete environment
      tags:
      - Environments
      parameters:
      - name: environment
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /environments/{environment}/start:
    post:
      operationId: public.environments.start
      description: Start an environment and trigger a deployment.
      summary: Start environment
      tags:
      - Environments
      parameters:
      - name: environment
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartEnvironmentRequest'
      responses:
        '200':
          description: '`DeploymentResource`'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeploymentResource'
                  included:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/EnvironmentResource'
                      - $ref: '#/components/schemas/UserResource'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /environments/{environment}/stop:
    post:
      operationId: public.environments.stop
      description: Stop an environment and cancel any in-progress deployment.
      summary: Stop environment
      tags:
      - Environments
      parameters:
      - name: environment
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
      responses:
        '200':
          description: '`EnvironmentResource`'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EnvironmentResource'
                  included:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/ApplicationResource'
                      - $ref: '#/components/schemas/BranchResource'
                      - $ref: '#/components/schemas/DeploymentResource'
                      - $ref: '#/components/schemas/DomainResource'
                      - $ref: '#/components/schemas/InstanceResource'
                      - $ref: '#/components/schemas/DatabaseSchemaResource'
                      - $ref: '#/components/schemas/CacheResource'
                      - $ref: '#/components/schemas/FilesystemResource'
                      - $ref: '#/components/schemas/WebsocketApplicationResource'
                      - $ref: '#/components/schemas/SecretResource'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /environments/{environment}/purge-edge-cache:
    post:
      operationId: public.environments.purge-edge-cache
      description: 'Purge the edge cache for all domains associated with the environment.


        By default everything cached for the environment is purged. Optionally provide

        a `path`, `prefix`, or `tag` to purge a subset of the cache. Only one of

        these may be provided per request.'
      summary: Purge edge cache
      tags:
      - Environments
      parameters:
      - name: environment
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurgeEnvironmentEdgeCacheRequest'
      responses:
        '200':
          description: '`EnvironmentResource`'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EnvironmentResource'
                  included:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/ApplicationResource'
                      - $ref: '#/components/schemas/BranchResource'
                      - $ref: '#/components/schemas/DeploymentResource'
                      - $ref: '#/components/schemas/DomainResource'
                      - $ref: '#/components/schemas/InstanceResource'
                      - $ref: '#/components/schemas/DatabaseSchemaResource'
                      - $ref: '#/components/schemas/CacheResource'
                      - $ref: '#/components/schemas/FilesystemResource'
                      - $ref: '#/components/schemas/WebsocketApplicationResource'
                      - $ref: '#/components/schemas/SecretResource'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /environments/{environment}/vanity-domain:
    put:
      operationId: public.environments.vanity-domain.update
      description: Update the vanity domain for the environment. May only be done once every 30 minutes.
      summary: Update vanity domain
      tags:
      - Environments
      parameters:
      - name: environment
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVanityDomainRequest'
      responses:
        '200':
          description: '`EnvironmentResource`'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EnvironmentResource'
                  included:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/ApplicationResource'
                      - $ref: '#/components/schemas/BranchResource'
                      - $ref: '#/components/schemas/DeploymentResource'
                      - $ref: '#/components/schemas/DomainResource'
                      - $ref: '#/components/schemas/InstanceResource'
                      - $ref: '#/components/schemas/DatabaseSchemaResource'
                      - $ref: '#/components/schemas/CacheResource'
                      - $ref: '#/components/schemas/FilesystemResource'
                      - $ref: '#/components/schemas/WebsocketApplicationResource'
                      - $ref: '#/components/schemas/SecretResource'
                required:
                - data
        '429':
          description: An error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error overview.
                    examples:
                    - The vanity domain may only be updated once every 30 minutes.
                required:
                - message
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /environments/{environment}/variables:
    post:
      operationId: public.environments.variables.store
      description: Add environment variables to an environment.
      summary: Add environment variables
      tags:
      - Environments
      parameters:
      - name: environment
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreEnvironmentVariablesRequest'
      responses:
        '200':
          description: '`EnvironmentResource`'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EnvironmentResource'
                  included:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/ApplicationResource'
                      - $ref: '#/components/schemas/BranchResource'
                      - $ref: '#/components/schemas/DeploymentResource'
                      - $ref: '#/components/schemas/DomainResource'
                      - $ref: '#/components/schemas/InstanceResource'
                      - $ref: '#/components/schemas/DatabaseSchemaResource'
                      - $ref: '#/components/schemas/CacheResource'
                      - $ref: '#/components/schemas/FilesystemResource'
                      - $ref: '#/components/schemas/WebsocketApplicationResource'
                      - $ref: '#/components/schemas/SecretResource'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /environments/{environment}/variables/delete:
    post:
      operationId: public.environments.variables.destroy
      description: 'Remove specific environment variables by key name. This operation is atomic: if any of the specified keys do not exist, no variables will be deleted and an error will be returned indicating which keys were missing.'
      summary: Delete environment variables
      tags:
      - Environments
      parameters:
      - name: environment
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteEnvironmentVariablesRequest'
      responses:
        '200':
          description: '`EnvironmentResource`'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EnvironmentResource'
                  included:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/ApplicationResource'
                      - $ref: '#/components/schemas/BranchResource'
                      - $ref: '#/components/schemas/DeploymentResource'
                      - $ref: '#/components/schemas/DomainResource'
                      - $ref: '#/components/schemas/InstanceResource'
                      - $ref: '#/components/schemas/DatabaseSchemaResource'
                      - $ref: '#/components/schemas/CacheResource'
                      - $ref: '#/components/schemas/FilesystemResource'
                      - $ref: '#/components/schemas/WebsocketApplicationResource'
                      - $ref: '#/components/schemas/SecretResource'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /environments/{environment}/metrics:
    get:
      operationId: public.environments.metrics
      description: 'Get metrics for a specific environment.


        Each metric is read separately; one that could not be read is `{"error": true}` while the rest are

        returned. For `http_response_count`, `average` holds each series'' sum over the period and `total` the

        sum of all of them. `min` and `max` are bounds for charting the series.'
      summary: Get environment metrics
      tags:
      - Environments
      parameters:
      - name: environment
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
      - name: period
        in: query
        schema:
          anyOf:
          - $ref: '#/components/schemas/MetricPeriod'
          - type: 'null'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cpu_usage:
                        anyOf:
                        - type: object
                          properties:
                            labels:
                              type: array
                              items:
                                type: string
                            data:
                              type: array
                              items:
                                type: object
                                properties:
                                  x:
                                    type: string
                                  y:
                                    type: array
                                    items:
                                      type: number
                                required:
                                - x
                                - y
                            average:
                              type: array
                              items:
                                type: number
                            min:
                              type: number
                            max:
                              type: number
                          required:
                          - labels
                          - data
                          - average
                          - min
                          - max
                        - type: object
                          properties:
                            error:
                              type: boolean
                          required:
                          - error
                      memory_usage:
                        anyOf:
                        - type: object
                          properties:
                            labels:
                              type: array
                              items:
                                type: string
                            data:
                              type: array
                              items:
                                type: object
                                properties:
                                  x:
                                    type: string
                                  y:
                                    type: array
                                    items:
                                      type: number
                                required:
                                - x
                                - y
                            average:
                              type: array
                              items:
                                type: number
                            min:
                              type: number
                            max:
                              type: number
                          required:
                          - labels
                          - data
                          - average
                          - min
                          - max
                        - type: object
                          properties:
                            error:
                              type: boolean
                          required:
                          - error
                      http_response_count:
                        anyOf:
                        - type: object
                          properties:
                            labels:
                              type: array
                              items:
                                type: string
                            data:
                              type: array
                              items:
                                type: object
                                properties:
                                  x:
                                    type: string
                                  y:
                                    type: array
                                    items:
                                      type: number
                                required:
                                - x
                                - y
                            total:
                              type: integer
                            average:
                              type: array
                              items:
                                type: integer
                            min:
                              type: integer
                            max:
                              type: integer
                          required:
                          - labels
                          - data
                          - total
                          - average
                          - min
                          - max
                        - type: object
                          properties:
                            error:
                              type: boolean
                          required:
                          - error
                      replica_count:
                        anyOf:
                        - type: object
                          properties:
                            labels:
                              type: array
                              items:
                                type: string
                            data:
                              type: array
                              items:
                                type: object
                                properties:
                                  x:
                                    type: string
                                  y:
                                    type: array
                                    items:
                                      type: integer
                                required:
                                - x
                                - y
                            average:
                              type: array
                              items:
                                type: integer
                            min:
                              type: integer
                            max:
                              type: integer
                          required:
                          - labels
                          - data
                          - average
                          - min
                          - max
                        - type: object
                          properties:
                            error:
                              type: boolean
                          required:
                          - error
                      web_workers_count:
                        anyOf:
                        - type: object
                          properties:
                            labels:
                              type: array
                              items:
                                type: string
                            data:
                              type: array
                              items:
                                type: object
                                properties:
                                  x:
                                    type: string
                                  y:
                                    type: array
                                    items:
                                      type: number
                                required:
                                - x
                                - y
                            average:
                              type: array
                              items:
                                type: number
                            min:
                              type: number
                            max:
                              type: number
                          required:
                          - labels
                          - data
                          - average
                          - min
                          - max
                        - type: object
                          properties:
                            error:
                              type: boolean
                          required:
                          - error
                    required:
                    - cpu_usage
                    - memory_usage
                    - http_response_count
                    - replica_count
                    - web_workers_count
                  meta:
                    type: object
                    properties:
                      period:
                        type: string
                      available_periods:
                        type: array
                        items:
                          type: string
                    required:
                    - period
                    - available_periods
                required:
                - data
                - meta
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /environments/{environment}/secrets:
    post:
      operationId: public.environments.secrets.store
      description: 'Attach one or more of the organization''s secrets to an environment. Secrets that are already

        attached to the environment are ignored.'
      summary: Attach secrets to environment
      tags:
      - Environments
      parameters:
      - name: environment
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreEnvironmentSecretsRequest'
      responses:
        '200':
          description: '`EnvironmentResource`'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EnvironmentResource'
                  included:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/ApplicationResource'
                      - $ref: '#/components/schemas/BranchResource'
                      - $ref: '#/components/schemas/DeploymentResource'
                      - $ref: '#/components/schemas/DomainResource'
                      - $ref: '#/components/schemas/InstanceResource'
                      - $ref: '#/components/schemas/DatabaseSchemaResource'
                      - $ref: '#/components/schemas/CacheResource'
                      - $ref: '#/components/schemas/FilesystemResource'
                      - $ref: '#/components/schemas/WebsocketApplicationResource'
                      - $ref: '#/components/schemas/SecretResource'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /environments/{environment}/secrets/{secret}:
    delete:
      operationId: public.environments.secrets.destroy
      description: Detach one of the organization's secrets from an environment. The secret itself is not deleted.
      summary: Detach secret from environment
      tags:
      - Environments
      parameters:
      - name: environment
        in: path
        required: true
        description: The environment identifier
        schema:
          type: string
      - name: secret
        in: path
        required: true
        description: The secret identifier
        schema:
          type: string
      responses:
        '200':
          description: '`EnvironmentResource`'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EnvironmentResource'
                  included:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/ApplicationResource'
                      - $ref: '#/components/schemas/BranchResource'
                      - $ref: '#/components/schemas/DeploymentResource'
                      - $ref: '#/components/schemas/DomainResource'
                      - $ref: '#/components/schemas/InstanceResource'
                      - $ref: '#/components/schemas/DatabaseSchemaResource'
                      - $ref: '#/components/schemas/CacheResource'
                      - $ref: '#/components/schemas/FilesystemResource'
                      - $ref: '#/components/schemas/WebsocketApplicationResource'
                      - $ref: '#/components/schemas/SecretResource'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
components:
  schemas:
    NormalizedLogResource:
