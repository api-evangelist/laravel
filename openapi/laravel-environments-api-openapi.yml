    DomainResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - domains
        attributes:
          type: object
          properties:
            name:
              type: string
            type:
              $ref: '#/components/schemas/DomainType'
            stage:
              $ref: '#/components/schemas/DomainStage'
            hostname_status:
              $ref: '#/components/schemas/DomainStatus'
            ssl_status:
              $ref: '#/components/schemas/DomainStatus'
            origin_status:
              $ref: '#/components/schemas/DomainStatus'
            redirect:
              anyOf:
              - $ref: '#/components/schemas/DomainRedirect'
              - type: 'null'
            cloudflare_strategy:
              anyOf:
              - $ref: '#/components/schemas/DomainCloudflareStrategy'
              - type: 'null'
            downtime:
              type:
              - boolean
              - 'null'
            wildcard_enabled:
              type: boolean
            dns_records:
              type: object
              properties:
                ssl:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - CNAME
                        - TXT
                      name:
                        type:
                        - string
                        - 'null'
                      value:
                        type:
                        - string
                        - 'null'
                    required:
                    - type
                    - name
                    - value
                pre_verification:
                  type: string
                origin:
                  type: string
                origin_cname:
                  type: string
                dcv:
                  type: string
              required:
              - ssl
              - pre_verification
              - origin
              - origin_cname
              - dcv
            wildcard:
              type:
              - object
              - 'null'
              properties:
                hostname_status:
                  $ref: '#/components/schemas/DomainStatus'
                ssl_status:
                  $ref: '#/components/schemas/DomainStatus'
                origin_status:
                  $ref: '#/components/schemas/DomainStatus'
                dns_records:
                  type: object
                  properties:
                    ssl:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - CNAME
                            - TXT
                          name:
                            type:
                            - string
                            - 'null'
                          value:
                            type:
                            - string
                            - 'null'
                        required:
                        - type
                        - name
                        - value
                    pre_verification:
                      type: string
                    origin:
                      type: string
                    origin_cname:
                      type: string
                    dcv:
                      type: string
                  required:
                  - ssl
                  - pre_verification
                  - origin
                  - origin_cname
                  - dcv
              required:
              - hostname_status
              - ssl_status
              - origin_status
              - dns_records
            www:
              type:
              - object
              - 'null'
              properties:
                hostname_status:
                  $ref: '#/components/schemas/DomainStatus'
                ssl_status:
                  $ref: '#/components/schemas/DomainStatus'
                origin_status:
                  $ref: '#/components/schemas/DomainStatus'
                dns_records:
                  type: object
                  properties:
                    ssl:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - CNAME
                            - TXT
                          name:
                            type:
                            - string
                            - 'null'
                          value:
                            type:
                            - string
                            - 'null'
                        required:
                        - type
                        - name
                        - value
                    pre_verification:
                      type: string
                    origin:
                      type: string
                    origin_cname:
                      type: string
                    dcv:
                      type: string
                  required:
                  - ssl
                  - pre_verification
                  - origin
                  - origin_cname
                  - dcv
              required:
              - hostname_status
              - ssl_status
              - origin_status
              - dns_records
            action_required:
              anyOf:
              - $ref: '#/components/schemas/DomainActionRequired'
              - type: 'null'
            last_verified_at:
              type:
              - string
              - 'null'
              format: date-time
            created_at:
              type:
              - string
              - 'null'
              format: date-time
          required:
          - name
          - type
          - stage
          - hostname_status
          - ssl_status
          - origin_status
          - redirect
          - cloudflare_strategy
          - downtime
          - wildcard_enabled
          - dns_records
          - wildcard
          - www
          - action_required
          - last_verified_at
          - created_at
        relationships:
          type: object
          properties:
            environment:
              type: object
              properties:
                data:
                  anyOf:
                  - $ref: '#/components/schemas/EnvironmentResourceIdentifier'
                  - type: 'null'
              required:
              - data
        links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
          required:
          - self
      required:
      - id
      - type
      - links
      title: DomainResource
    ContentType:
      type: string
      enum:
      - nosniff
      - none
      title: ContentType
    RateLimitLevel:
