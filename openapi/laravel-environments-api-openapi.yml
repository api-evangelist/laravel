    PurgeEnvironmentEdgeCacheRequest:
      type: object
      properties:
        path:
          type:
          - string
          - 'null'
          description: A single path to purge, resolved against every hostname the environment is served from.
          examples:
          - /blog/hello-world
          maxLength: 2048
        prefix:
          type:
          - string
          - 'null'
          description: A path prefix to purge, resolved against every hostname the environment is served from.
          examples:
          - /blog/
          maxLength: 2048
        tag:
          type:
          - string
          - 'null'
          description: A `Cache-Tag` value to purge. Requires the environment to use a dedicated edge network.
          examples:
          - blog-posts
          maxLength: 1024
      title: PurgeEnvironmentEdgeCacheRequest
    StoreEnvironmentVariablesRequest:
      type: object
      properties:
        method:
          description: 'When set to ''append'', variables are added to the end without checking for duplicates.

            When set to ''set'', variables with matching keys are updated; otherwise they are added.'
          $ref: '#/components/schemas/EnvironmentVariablesInsertMethod'
        variables:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
              value:
                type: string
            required:
            - key
            - value
          minItems: 1
          maxItems: 200
      required:
      - method
      - variables
      title: StoreEnvironmentVariablesRequest
    Language:
      type: string
      enum:
      - html
      - php
      - javascript
      - python
      - go
      - ruby
      - java
      - rust
      title: Language
    DeleteEnvironmentVariablesRequest:
      type: object
      properties:
        keys:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
          minItems: 1
      required:
      - keys
      title: DeleteEnvironmentVariablesRequest
    InstanceType:
      type: string
      enum:
      - app
      - service
      - queue
      - managed_queue
