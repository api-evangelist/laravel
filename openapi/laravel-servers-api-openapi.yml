components:
  schemas:
    SupervisorAction:
      type: string
      description: '| |

        |---|

        | `reboot` <br/> Reboot the Supervisor service |'
      enum:
      - reboot
      title: SupervisorAction
    PhpOpcacheResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - phpOpcaches
        attributes:
          type: object
          properties:
            opcache_enabled:
              type: boolean
          required:
          - opcache_enabled
        links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
          required:
          - self
      required:
      - id
      - type
      - links
      title: PhpOpcacheResource
    Link:
      type: object
      properties:
        href:
          type: string
          format: uri
        rel:
          type: string
        describedby:
          type: string
        title:
          type: string
        type:
          type: string
        hreflang:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
        meta:
          type: object
      required:
      - href
      title: Link
    UserResourceIdentifier:
      type: object
      properties:
        type:
          type: string
          enum:
          - users
        id:
          type: string
      required:
      - type
      - id
      title: UserResourceIdentifier
    UpdateServerNetworkRequest:
      type: object
      properties:
        servers:
          type: array
          description: The server IDs that should be in this server's network.
          examples:
          - - 1
            - 2
            - 3
          items:
            type: integer
            description: A server ID to include in the network.
            examples:
            - 1
      required:
      - servers
      title: UpdateServerNetworkRequest
    RedisServiceActionRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/RedisAction'
      required:
      - action
      title: RedisServiceActionRequest
    ArchiveRequest:
      type: object
      properties:
        server_id:
          type: integer
      required:
      - server_id
      title: ArchiveRequest
    PhpServiceActionRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/PhpAction'
        version:
          $ref: '#/components/schemas/PhpVersion'
      required:
      - action
      - version
      title: PhpServiceActionRequest
    UserResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - users
        attributes:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            created_at:
              type:
              - string
              - 'null'
              format: date-time
            updated_at:
              type:
              - string
              - 'null'
              format: date-time
          required:
          - name
          - email
          - created_at
          - updated_at
        links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
          required:
          - self
      required:
      - id
      - type
      - links
      title: UserResource
    TagResourceIdentifier:
      type: object
      properties:
        type:
          type: string
          enum:
          - tags
        id:
          type: string
      required:
      - type
      - id
      title: TagResourceIdentifier
    NginxAction:
      type: string
      description: '| |

        |---|

        | `reboot` <br/> Reboot the Nginx service |

        | `stop` <br/> Stop the Nginx service |'
      enum:
      - reboot
      - stop
      title: NginxAction
    UpdateServerRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the server.
          examples:
          - production-web-01
        ip_address:
          type: string
          description: The IP address of the server.
          examples:
          - 192.168.1.1
        private_ip_address:
          type: string
          description: The private IP address of the server.
          examples:
          - 10.0.0.1
        timezone:
          type: string
          description: The timezone of the server.
          examples:
          - America/New_York
        tags:
          type: array
          description: The tags of the server.
          examples:
          - - production
            - web
          items:
            type: string
            examples:
            - production
      title: UpdateServerRequest
    EventResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - events
        attributes:
          type: object
          properties:
            description:
              type: string
              description: The description of the event.
              examples:
              - Adding database
            ran_as:
              type:
              - string
              - 'null'
              description: The server user that the event was run as.
              examples:
              - forge
            created_at:
              type: string
              format: date-time
              description: The date and time the event was created.
              examples:
              - '2025-07-29T09:00:00Z'
            updated_at:
              type: string
              format: date-time
              description: The date and time the event was last updated.
              examples:
              - '2025-07-30T09:00:00Z'
          required:
          - description
          - ran_as
          - created_at
          - updated_at
        relationships:
          type: object
          properties:
            initiator:
              type: object
              properties:
                data:
                  anyOf:
                  - $ref: '#/components/schemas/UserResourceIdentifier'
                  - type: 'null'
              required:
              - data
        links:
          type: object
          properties:
            self:
              description: A link to the resource itself
              $ref: '#/components/schemas/Link'
          required:
          - self
      required:
      - id
      - type
      - links
      title: EventResource
    PhpVersionResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - phpVersions
        attributes:
          type: object
          properties:
            version:
              type: string
              enum:
