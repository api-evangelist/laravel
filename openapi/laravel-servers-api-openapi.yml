openapi: 3.1.0
info:
  title: Laravel Cloud Applications Servers API
  version: 0.0.1
servers:
- url: https://cloud.laravel.com/api
security:
- http: []
tags:
- name: Servers
paths:
  /orgs/{organization}/servers:
    get:
      operationId: organizations.servers.index
      description: 'Show all servers for the organization.


        Processing mode: <small><code>sync</code></small>'
      summary: List servers
      tags:
      - Servers
      parameters:
      - name: organization
        in: path
        required: true
        description: The organization slug
        schema:
          type: string
      - name: page[size]
        in: query
        description: The number of results that will be returned per page.
        schema:
          type: integer
          default: 30
      - name: page[cursor]
        in: query
        description: The cursor to start the pagination from.
        schema:
          type: string
      - name: filter[ip_address]
        in: query
        description: The IP address of the server.
        schema:
          type: string
          examples:
          - 192.168.1.1
      - name: filter[name]
        in: query
        description: The name of the server.
        schema:
          type: string
          examples:
          - production-web-01
      - name: filter[region]
        in: query
        description: The region where the server is located.
        schema:
          type: string
          examples:
          - nyc3
      - name: filter[size]
        in: query
        description: The size of the server.
        schema:
          type: string
          examples:
          - s-2vcpu-2gb
      - name: filter[provider]
        in: query
        description: The provider of the server.
        schema:
          type: string
          examples:
          - ocean2
      - name: filter[ubuntu_version]
        in: query
        description: The Ubuntu version of the server.
        schema:
          type: string
          examples:
          - 24.04
      - name: filter[php_version]
        in: query
        description: The PHP version of the server.
        schema:
          type: string
          examples:
          - php83
      - name: filter[database_type]
        in: query
        description: The database type of the server.
        schema:
          type: string
          examples:
          - mysql
      - name: sort
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - name
            - -name
            - provider
            - -provider
            - ubuntu_version
            - -ubuntu_version
            - region
            - -region
            - php_version
            - -php_version
            - created_at
            - -created_at
            - updated_at
            - -updated_at
        explode: false
      responses:
        '200':
          description: Paginated set of `ServerResource`
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServerResource'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type: string
                      next:
                        type: string
                  meta:
                    type: object
                    properties:
                      path:
                        type:
                        - string
                        - 'null'
                        description: Base path for paginator generated URLs.
                      per_page:
                        type: integer
                        description: Number of items shown per page.
                        minimum: 0
                      next_cursor:
                        type:
                        - string
                        - 'null'
                        description: The "cursor" that points to the next set of items.
                      prev_cursor:
                        type:
                        - string
                        - 'null'
                        description: The "cursor" that points to the previous set of items.
                    required:
                    - path
                    - per_page
                    - next_cursor
                    - prev_cursor
                  included:
                    type: array
                    items:
                      $ref: '#/components/schemas/TagResource'
                required:
                - data
                - links
                - meta
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
      security:
      - oauth2:
        - server:view
      x-permissions:
      - server:view
      x-mint:
        metadata:
          noindex: true
      x-processingMode: sync
    post:
      operationId: organizations.servers.store
      description: 'Create a new server in the organization. Supports both standard cloud providers

        and custom VPS configurations.


        Processing mode: <small><code>async</code></small>'
      summary: Create server
      tags:
      - Servers
      parameters:
      - name: organization
        in: path
        required: true
        description: The organization slug
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CreateServerRequest'
              - type: object
                properties:
                  add_key_to_source_control:
                    type: boolean
                    default: true
                  database:
                    type: string
                  laravel:
                    type: object
                    properties:
                      vpc_uuid:
                        type: string
                  hetzner:
                    type: object
                    properties:
                      enable_weekly_backups:
                        type: boolean
                        default: false
      responses:
        '202':
          description: '`ServerResource`'
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServerResource'
                  included:
                    type: array
                    items:
                      $ref: '#/components/schemas/TagResource'
                required:
                - data
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
      security:
      - oauth2:
        - server:create
      x-permissions:
      - server:create
      x-mint:
        metadata:
          noindex: true
      x-processingMode: async
  /orgs/{organization}/servers/archives:
    get:
      operationId: organizations.servers.archives.index
      description: 'Get all archived servers for the organization.


        Processing mode: <small><code>sync</code></small>'
      summary: List archived servers
      tags:
