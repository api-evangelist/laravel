              - '7.0'
              - '7.1'
              - '7.2'
              - '7.3'
              - '7.4'
              - '8.0'
              - '8.1'
              - '8.2'
              - '8.3'
              - '8.4'
              - '8.5'
              - '5'
            binary_name:
              type: string
            status:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
          required:
          - version
          - binary_name
          - status
          - created_at
          - updated_at
        links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
          required:
          - self
      required:
      - id
      - type
      - links
      title: PhpVersionResource
    CreatePhpVersionRequest:
