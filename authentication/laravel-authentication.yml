schemes:
- name: http
  type: http
  scheme: bearer
  bearerFormat: bearer
  description: The Bearer Token generated on the Cloud UI.
  sources:
  - openapi/laravel-cloud-openapi.json
  - openapi/laravel-forge-openapi.json
- name: oauth2
  type: oauth2
  flows:
